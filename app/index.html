<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rival</title>
<meta name="description" content="Workout logger that puts last session's numbers beside every set, adjusts targets to how you slept, and maps weekly sets per muscle.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEEE9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0F13">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rival">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(../assets/fonts/archivo.woff2) format("woff2-variations"),url(../assets/fonts/archivo.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-display:swap;font-weight:400 700;src:url(../assets/fonts/instrument-sans.woff2) format("woff2-variations"),url(../assets/fonts/instrument-sans.woff2) format("woff2")}
html{padding:env(safe-area-inset-top,0px) 0 0}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one narrow column (max 520px), three tabs, a full-screen logger that rises over everything.
   Palette borrows from competition plates: chalk ground, plate-blue accent, plate-yellow for wins, plate-red for over-volume. */
:root{
  --bg:#ECEEE9; --surface:#FFFFFF; --surface-2:#F4F5F1; --ink:#14161B; --muted:#5F646D; --faint:#9EA3AB;
  --line:rgba(20,22,27,.09); --accent:#2747DB; --accent-ink:#FFFFFF; --accent-soft:rgba(39,71,219,.10);
  --ghost:#878E9D; --win:#946500; --win-bg:rgba(242,183,5,.22); --warn:#C63A25; --body:#D9DCD4;
  --scrim:rgba(14,16,20,.38); --coach-scrim:rgba(14,16,20,.58); --glass:rgba(255,255,255,.78);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --surface:#16191F; --surface-2:#1E222A; --ink:#ECEEF2; --muted:#979DA8; --faint:#5C626D;
  --line:rgba(255,255,255,.08); --accent:#7C91FF; --accent-ink:#0D0F13; --accent-soft:rgba(124,145,255,.15);
  --ghost:#717887; --win:#F4C542; --win-bg:rgba(244,197,66,.15); --warn:#FF6F59; --body:#262A33;
  --scrim:rgba(0,0,0,.55); --coach-scrim:rgba(0,0,0,.68); --glass:rgba(22,25,31,.78); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F13; --surface:#16191F; --surface-2:#1E222A; --ink:#ECEEF2; --muted:#979DA8; --faint:#5C626D;
  --line:rgba(255,255,255,.08); --accent:#7C91FF; --accent-ink:#0D0F13; --accent-soft:rgba(124,145,255,.15);
  --ghost:#717887; --win:#F4C542; --win-bg:rgba(244,197,66,.15); --warn:#FF6F59; --body:#262A33;
  --scrim:rgba(0,0,0,.55); --coach-scrim:rgba(0,0,0,.68); --glass:rgba(22,25,31,.78); color-scheme:dark;
}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-stretch:108%}
.press{transition:transform 140ms var(--ease-out)}
.press:active{transform:scale(.97)}

/* ---------- shell ---------- */
.view{max-width:520px;margin:0 auto;padding:12px 16px calc(112px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-top:1px solid var(--line)}
.tabs-in{display:flex;width:100%;max-width:420px;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:76px;padding:6px 8px;border-radius:12px;color:var(--faint);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab .press-in{transition:transform 140ms var(--ease-out)}
.tab:active .press-in{transform:scale(.94)}

.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:21;
  display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);
  box-shadow:0 10px 30px rgba(0,0,0,.18);white-space:nowrap;font-weight:600;font-size:14px}
.resume .pill{background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:999px;font-size:13px}

/* ---------- type ---------- */
.date{color:var(--muted);font-size:14px;font-weight:500}
.title{font-family:var(--display);font-stretch:122%;font-weight:800;font-size:44px;line-height:.98;letter-spacing:-.025em;text-wrap:balance}
.h2{font-family:var(--display);font-stretch:112%;font-weight:750;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.h3{font-weight:650;font-size:16px;line-height:1.25}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.section{margin-top:28px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}

/* ---------- surfaces & controls ---------- */
.card{background:var(--surface);border-radius:22px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;font-weight:650;font-size:15px;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;height:54px;border-radius:16px;font-size:17px;font-family:var(--display);font-stretch:112%;font-weight:750;letter-spacing:.005em}
.btn.ghosty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{height:38px;padding:0 12px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- today ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;border-radius:14px;font-size:12px;color:var(--muted)}
.wd b{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:17px;color:var(--ink);font-weight:650}
.wd i{width:6px;height:6px;border-radius:50%;background:transparent}
.wd.done i{background:var(--accent)}
.wd.today{background:var(--surface)}
.hero{margin-top:22px}
.hero .sub{margin-top:8px}
.daypick{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.sample-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--win-bg);font-size:13.5px}
.sample-note button{font-weight:650;white-space:nowrap;padding:6px 4px}
.sample-note.install{background:var(--accent-soft)}
.sample-note.install button{color:var(--accent)}
.sample-note .acts{display:flex;gap:10px}

.ready{margin-top:18px}
.rq{display:grid;gap:14px;margin-top:14px}
.rq-row{display:grid;gap:8px}
.rq-row label{font-size:13px;font-weight:600;color:var(--muted)}
.rq-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rq-opts .chip{padding:0 4px;font-size:13.5px}
.ready-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.ready-res{display:flex;gap:16px;align-items:center}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--surface-2)}
.ring .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 520ms var(--ease-out)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.tier{font-family:var(--display);font-stretch:115%;font-weight:750;font-size:20px}
.fade-in{animation:fadeIn 220ms var(--ease-out)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.session{margin-top:12px}
.pv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pv:first-child{padding-top:2px}
.pv:last-of-type{border-bottom:0}
.pv .nm{font-weight:650;min-width:0}
.pv .sr{color:var(--muted);font-size:13.5px;text-align:right}
.pv .ln{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px}
.pv .tg{color:var(--ink)}
.pv .gh{color:var(--ghost);padding:0 6px;border-radius:7px;border:1.5px dashed color-mix(in oklab,var(--ghost) 55%,transparent)}
.session .btn.big{margin-top:14px}
.adj{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;vertical-align:1px}

/* ---------- progress ---------- */
.map-card{padding:16px 12px}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:end}
.body-fig{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.body-fig svg{width:100%;max-width:150px;height:auto;overflow:visible}
.m{cursor:pointer;transition:fill 200ms ease}
.m.l0{fill:var(--body)}
.m.l1{fill:color-mix(in oklab,var(--accent) 26%,var(--body))}
.m.l2{fill:color-mix(in oklab,var(--accent) 55%,var(--body))}
.m.l3{fill:var(--accent)}
.m.l4{fill:var(--warn)}
.m.sel{stroke:var(--ink);stroke-width:1.6}
.headc{fill:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mdetail{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px}
.mdetail b{font-weight:650}
.mlist{display:grid;gap:2px;margin-top:6px}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;align-items:center;gap:10px;padding:7px 4px;border-radius:10px;font-size:14px;text-align:left;width:100%}
.mrow.sel{background:var(--surface-2)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .zone{position:absolute;top:0;bottom:0;left:40%;width:40%;background:var(--accent-soft)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar .fill.over{background:var(--warn)}
.bar .fill.low{background:color-mix(in oklab,var(--accent) 45%,var(--body))}
.mrow .v{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:650}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:18px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.lift{display:grid;grid-template-columns:minmax(0,1fr) 96px 70px;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.lift:last-child{border-bottom:0}
.lift .nm{font-weight:650;min-width:0}
.lift .e{font-size:13px;color:var(--muted)}
.lift .d{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.lift .d.up{color:var(--accent)}
.spark{width:96px;height:30px;overflow:visible}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--accent-soft);stroke:none}
.spark circle{fill:var(--accent)}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.hist:last-child{border-bottom:0}
.hist .nm{font-weight:650}
.hist .r{text-align:right;font-size:13.5px;color:var(--muted)}
.hist .r b{color:var(--win);font-weight:700}
.tag-sample{font-size:11px;font-weight:700;color:var(--win);background:var(--win-bg);padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}

/* ---------- plan ---------- */
.day{margin-top:12px}
.day-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.slot .nm{font-weight:600;min-width:0}
.slot .sr{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.slot svg{width:16px;height:16px;color:var(--faint)}
.add{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:650;padding:12px 2px 2px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.sync{display:flex;align-items:center;gap:8px;font-size:14px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.on i{background:#2FA36B}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 300ms ease}
.sheet{position:relative;width:100%;max-width:520px;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;
  transform:translateY(100%);transition:transform 440ms var(--ease-drawer);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:translateY(0)}
.sheet-wrap.closing .sheet{transition-duration:300ms}
.grab{padding:10px 20px 4px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px;filter:contrast(1.6)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 20px 20px}
.sheet .h2{margin-bottom:4px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:600;display:grid;place-items:center}
.stepper output{min-width:54px;text-align:center;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.search{width:100%;height:46px;border-radius:14px;border:0;background:var(--surface-2);padding:0 14px;font-size:16px;margin:10px 0 6px}
.search:focus{outline:2px solid var(--accent);outline-offset:0}
.lib{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.lib .mu{color:var(--muted);font-size:13px;grid-column:1}
.lib .pl{grid-row:1/3;grid-column:2;align-self:center;color:var(--accent);font-weight:700;font-size:22px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.sum div{background:var(--surface-2);border-radius:16px;padding:12px 14px}
.sum b{display:block;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--muted)}
.sum .win b{color:var(--win)}
.prs{display:grid;gap:6px;margin-bottom:16px}
.prs div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--win-bg)}
.sheet-actions{display:grid;gap:8px}

/* ---------- workout ---------- */
.wo{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;
  transition:transform 460ms var(--ease-drawer),visibility 0s linear 460ms}
.wo.open{transform:translateY(0);visibility:visible;transition:transform 460ms var(--ease-drawer),visibility 0s}
.wo-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 10px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid var(--line)}
.wo-head .ic{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.wo-head .ic svg{width:24px;height:24px}
.wo-t{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:20px;line-height:1.1}
.wo-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px calc(120px + env(safe-area-inset-bottom,0px))}
.wo-in{max-width:520px;margin:0 auto;display:grid;gap:12px}
.adjust-note{font-size:13.5px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink)}
.adjust-note b{color:var(--accent)}
.ex{background:var(--surface);border-radius:22px;padding:14px 12px 10px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:0 4px}
.ex-h .h3{font-size:17px}
.ex-meta{font-size:13px;color:var(--muted);padding:2px 4px 10px}
.cols,.set{display:grid;grid-template-columns:24px minmax(0,1fr) 78px 58px 44px;gap:8px;align-items:center}
.cols{font-size:11.5px;font-weight:650;color:var(--faint);padding:0 4px 6px}
.cols span:nth-child(3),.cols span:nth-child(4){text-align:center}
.set{padding:4px 4px;border-radius:14px;transition:background-color 200ms ease}
.set .n{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);text-align:center}
.ghost{position:relative;height:44px;display:flex;align-items:center;min-width:0}
.g-txt{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:9px;border:1.5px dashed color-mix(in oklab,var(--ghost) 70%,transparent);
  font-family:var(--display);font-variant-numeric:tabular-nums;font-size:14px;color:var(--ghost);white-space:nowrap;
  transition:filter 220ms ease,opacity 220ms ease,transform 220ms var(--ease-out)}
.g-txt.none{border-color:transparent;font-family:var(--text);font-size:13px;color:var(--faint);padding:0}
.g-win{position:absolute;left:0;top:50%;display:inline-flex;align-items:center;height:26px;padding:0 8px;border-radius:8px;font-size:12.5px;font-weight:700;white-space:nowrap;
  background:var(--win-bg);color:var(--win);opacity:0;transform:translateY(-50%) scale(.9);transition:opacity 240ms var(--ease-out),transform 240ms var(--ease-out);pointer-events:none}
.g-win.match{background:var(--surface-2);color:var(--muted)}

function makeSamples() {

  const scores = [72,64,81,58,77,69,85,52,74,66,79,70];
  const out = [];

    const c = Math.floor(k / 4), d = k % 4, day = PROGRAM[d];
    const start = sod(Date.now() - off * DAY) + (18 * 60 + 20 + (k % 3) * 15) * 60000;
    const entries = day.ex.map(sl => {

      const w = ex.bw ? 0 : ex.base + (bump ? ex.inc : 0);
      const pat = c === 0 ? [1,0,0] : c === 1 || !bump ? [sl.hi - sl.lo, 1, 1] : [2,1,0];

const zoneWord = v => v <= 0 ? 'Not trained' : v < 10 ? 'Below target' : v <= 20 ? 'In target zone' : 'Above target';
const r1 = v => Math.round(v * 2) / 2;

function bodySVG(side, w) {
  const S2 = (mu, el) => `<g class="m l${lvl(w[mu].sets)}${selMuscle === mu ? ' sel' : ''}" data-act="muscle" data-m="${mu}" role="button" tabindex="0" aria-label="${MUSCLES[mu]}, ${r1(w[mu].sets)} sets">${el}</g>`;
  const R = (x, y, wd, h) => `<rect x="${x}" y="${y}" width="${wd}" height="${h}" rx="${Math.min(wd, h) / 2}"/>`;
  const C = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}"/>`;
  let g = `<circle class="headc" cx="60" cy="18" r="12"/>`;
  if (side === 'front') {
    g += S2('shoulders', C(35, 52, 10) + C(85, 52, 10));
    g += S2('chest', `<rect x="43" y="42" width="16.5" height="24" rx="8"/><rect x="60.5" y="42" width="16.5" height="24" rx="8"/>`);
    g += S2('biceps', R(23, 64, 11, 28) + R(86, 64, 11, 28));
    g += S2('forearms', R(18, 96, 10, 32) + R(92, 96, 10, 32));
    g += S2('abs', `<rect x="47" y="69" width="26" height="44" rx="10"/>`);
    g += S2('quads', R(41, 118, 17, 56) + R(62, 118, 17, 56));
    g += S2('calves', R(43, 180, 12, 40) + R(65, 180, 12, 40));
  } else {
    g += S2('traps', `<rect x="44" y="33" width="32" height="14" rx="7"/>`);
    g += S2('shoulders', C(35, 52, 10) + C(85, 52, 10));
    g += S2('lats', `<rect x="43" y="49" width="16.5" height="42" rx="8"/><rect x="60.5" y="49" width="16.5" height="42" rx="8"/>`);
    g += S2('triceps', R(23, 64, 11, 28) + R(86, 64, 11, 28));
    g += S2('forearms', R(18, 96, 10, 32) + R(92, 96, 10, 32));
    g += S2('lowerback', `<rect x="49" y="94" width="22" height="19" rx="8"/>`);
    g += S2('glutes', `<rect x="41" y="116" width="18.5" height="24" rx="9"/><rect x="60.5" y="116" width="18.5" height="24" rx="9"/>`);
    g += S2('hamstrings', R(41, 143, 17, 34) + R(62, 143, 17, 34));
    g += S2('calves', R(43, 182, 12, 38) + R(65, 182, 12, 38));
  }
  return `<svg viewBox="0 0 120 226" role="group" aria-label="${side === 'front' ? 'Front' : 'Back'} of body">${g}</svg>`;
}

function liftSeries(exId) {
  const pts = [];
  [...S.sessions].sort((a, b) => a.date - b.date).forEach(s => {
    const en = s.entries.find(e => e.exId === exId); if (!en || !en.sets.length) return;
    pts.push({t: s.date, v: Math.max(...en.sets.map(x => e1(x.w, x.r)))});
  });
  return pts;
}
function spark(pts) {
  if (pts.length < 2) return '<svg class="spark" viewBox="0 0 96 30"></svg>';
  const min = Math.min(...pts.map(p => p.v)), max = Math.max(...pts.map(p => p.v)), rng = max - min || 1;
  const xy = pts.map((p, i) => [i / (pts.length - 1) * 92 + 2, 26 - (p.v - min) / rng * 22]);
  const line = xy.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 96 30" aria-hidden="true"><polygon class="area" points="2,28 ${line} 94,28"/><polyline points="${line}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6"/></svg>`;
}

function vProgress() {
  const now = Date.now(), from = sod(now - 6 * DAY), to = sod(now) + DAY;
  const w = weekSets(from, to);
  const ss = S.sessions.filter(s => s.date >= from && s.date < to);
  const setsN = ss.reduce((a, s) => a + s.entries.reduce((b, e) => b + e.sets.length, 0), 0);
  const beat = ss.reduce((a, s) => a + s.entries.reduce((b, e) => b + e.sets.filter(x => x.res === 'beat').length, 0), 0);
  const sel = selMuscle && w[selMuscle];
  const detail = sel
    ? `<div class="mdetail"><b>${MUSCLES[selMuscle]}</b>: ${r1(sel.sets)} weekly sets, ${zoneWord(sel.sets).toLowerCase()}.${Object.keys(sel.by).length ? ' From ' + Object.entries(sel.by).sort((a, b) => b[1] - a[1]).map(([n, v]) => esc(n) + ' (' + r1(v) + ')').join(', ') + '.' : ''}</div>`
    : `<div class="mdetail">Tap a muscle to see where its sets came from. Secondary muscles count as half a set.</div>`;
  const rows = Object.keys(MUSCLES).sort((a, b) => w[b].sets - w[a].sets).map(mu => {
    const v = w[mu].sets, pct = Math.min(v / 25, 1) * 100;
    return `<button class="mrow${selMuscle === mu ? ' sel' : ''}" data-act="muscle" data-m="${mu}"><span>${MUSCLES[mu]}</span><span class="bar"><span class="zone"></span><span class="fill${v > 20 ? ' over' : v < 10 ? ' low' : ''}" style="width:${pct}%"></span></span><span class="v">${r1(v)}</span></button>`;
  }).join('');
  const liftIds = [...new Set(sorted().flatMap(s => s.entries.map(e => e.exId)))].filter(id => EX[id] && EX[id].c && !EX[id].bw);
  const lifts = liftIds.map(id => ({id, pts: liftSeries(id)})).filter(l => l.pts.length >= 2).slice(0, 8).map(l => {
    const a = l.pts[0].v, b = l.pts[l.pts.length - 1].v, d = b - a;
    return `<button class="lift" data-act="lift" data-id="${l.id}"><span><span class="nm">${esc(EX[l.id].n)}</span><br><span class="e">Est. 1-rep max ${fmtW(roundTo(b, .5))} ${U()}</span></span>${spark(l.pts)}<span class="d${d > 0.4 ? ' up' : ''}">${d > 0.4 ? '+' : ''}${fmtW(roundTo(d, .5))} ${U()}</span></button>`;
  }).join('');
  const hist = sorted().slice(0, 12).map(s => {
    const n = s.entries.reduce((a, e) => a + e.sets.length, 0), b = s.entries.reduce((a, e) => a + e.sets.filter(x => x.res === 'beat').length, 0);
    return `<button class="hist" data-act="session" data-id="${s.id}"><span class="nm">${esc(s.dayName)}${s.sample ? '<span class="tag-sample">Sample</span>' : ''}</span><span class="r">${pl(n, 'set')}</span><span class="sub">${fmtDate(s.date, {weekday:'short', day:'numeric', month:'short'})}, ${s.dur} min</span><span class="r">${b ? `<b>${b}</b> beat the ghost` : 'No ghosts beaten'}</span></button>`;
  }).join('');
  return `<header><p class="date">Last 7 days</p><h1 class="title">Progress</h1></header>
    <div class="stats section" style="margin-top:20px"><div class="stat"><b>${ss.length}</b><span>${ss.length === 1 ? 'session' : 'sessions'}</span></div><div class="stat"><b>${setsN}</b><span>hard sets</span></div><div class="stat"><b>${beat}</b><span>ghosts beaten</span></div></div>
    <section class="section"><div class="section-head"><h2 class="h2">Weekly sets by muscle</h2></div>
      <div class="card map-card"><div class="bodies"><div class="body-fig">${bodySVG('front', w)}Front</div><div class="body-fig">${bodySVG('back', w)}Back</div></div>
      <div class="legend"><span><i style="background:var(--body)"></i>None</span><span><i style="background:color-mix(in oklab,var(--accent) 55%,var(--body))"></i>Under 10</span><span><i style="background:var(--accent)"></i>10–20 target</span><span><i style="background:var(--warn)"></i>Over 20</span></div>
      ${detail}<div class="mlist">${rows}</div></div></section>
    <section class="section"><div class="section-head"><h2 class="h2">Main lifts</h2><span class="sub">Change since first log</span></div><div class="card" style="padding:4px 12px">${lifts || '<p class="empty">Log a lift twice to see its trend.</p>'}</div></section>
    <section class="section"><div class="section-head"><h2 class="h2">History</h2></div><div class="card" style="padding:4px 12px">${hist || '<p class="empty">Finished workouts show up here.</p>'}</div></section>`;
}

let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function noInstall() { try { return !!localStorage.getItem('rival.noinstall'); } catch (e) { return false; } }
function installNote() {
  if (isStandalone() || noInstall()) return '';
  if (installEvt) return `<div class="sample-note install"><span>Install Rival for full screen and offline use.</span><span class="acts"><button data-act="install">Install</button><button data-act="noinstall" aria-label="Dismiss">Not now</button></span></div>`;
  if (isIOS) return `<div class="sample-note install"><span>Install Rival: tap Share in Safari, then Add to Home Screen.</span><button data-act="noinstall">Got it</button></div>`;

}
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (tab === 'today') render(); });
addEventListener('appinstalled', () => { installEvt = null; render(); });

function backupBlob() {
  const data = {app:'rival', v:1, exportedAt:new Date().toISOString(), profile:S.profile, sessions:S.sessions.filter(s => !s.sample)};
  return new Blob([JSON.stringify(data)], {type:'application/json'});
}
async function exportBackup() {
  const name = 'rival-backup-' + dkey(Date.now()) + '.json';
  const blob = backupBlob();
  try {
    const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Rival backup'}); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Backup saved as ' + name);
}
let pendingImport = null;
function readBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let d = null; try { d = JSON.parse(fr.result); } catch (e) {}
    if (!d || d.app !== 'rival' || !d.profile || !Array.isArray(d.profile.days) || !Array.isArray(d.sessions)) { toast("That file isn't a Rival backup"); return; }
    pendingImport = d;
    const when = d.exportedAt ? fmtDate(d.exportedAt, {day:'numeric', month:'long', year:'numeric'}) : 'an unknown date';
    openSheet(`<h2 class="h2">Restore this backup?</h2><p class="sub">${pl(d.sessions.length, 'workout')} and your plan, exported ${esc(when)}. This replaces everything currently on this phone.</p>
      <div class="sheet-actions" style="margin-top:16px"><button class="btn primary big press" data-act="restore">Replace with backup</button><button class="btn press" data-act="closesheet">Cancel</button></div>`, () => {});
  };
  fr.readAsText(file);
}

/* ================= sheets ================= */
let sheetEl = null;
function openSheet(html, onClose) {
  closeSheet(true);
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-body">${html}</div></div>`;
  document.body.appendChild(wrap);
  sheetEl = wrap; wrap._onClose = onClose;
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  dragToDismiss(wrap);
  const f = wrap.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus({preventScroll:true}), 460);
  return wrap;
}
function setSheet(html) { if (sheetEl) sheetEl.querySelector('.sheet-body').innerHTML = html; }
function closeSheet(instant) {
  const w = sheetEl; if (!w) return; sheetEl = null;
  if (w._onClose) w._onClose();
  if (instant) { w.remove(); return; }
  const sh = w.querySelector('.sheet'); sh.style.transform = '';
  w.classList.add('closing'); w.classList.remove('open');
  setTimeout(() => w.remove(), 320);
}
function dragToDismiss(wrap) {
  const sh = wrap.querySelector('.sheet'), grab = wrap.querySelector('.grab');
  let y0 = 0, t0 = 0, dy = 0, on = false;
  grab.addEventListener('pointerdown', e => {
    on = true; y0 = e.clientY; t0 = performance.now(); dy = 0;
    grab.setPointerCapture(e.pointerId); sh.style.transition = 'none';
  });
  grab.addEventListener('pointermove', e => {
    if (!on) return;
    const raw = e.clientY - y0;
    dy = raw >= 0 ? raw : -(Math.abs(raw) * 60 / (60 + Math.abs(raw))); // friction past the top
    sh.style.transform = `translateY(${dy}px)`;
  });
  const end = () => {
    if (!on) return; on = false;
    const v = dy / Math.max(1, performance.now() - t0);
    sh.style.transition = '';
    if (dy > sh.offsetHeight * 0.3 || (v > 0.11 && dy > 12)) closeSheet();
    else sh.style.transform = '';
  };
  grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
}

/* ================= toast ================= */
function toast(msg, action) {
  const box = $('#toasts'), t = document.createElement('div');
  t.className = 'toast'; const sp = document.createElement('span'); sp.textContent = msg; t.appendChild(sp);
  let timer = 0;
  const hide = () => { clearTimeout(timer); t.classList.remove('show'); setTimeout(() => t.remove(), 260); };
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.addEventListener('click', () => { action.fn(); hide(); }); t.appendChild(b); }
  box.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  timer = setTimeout(hide, action ? 5000 : 2400);
}

function renderWorkout() {

function logSet(row) {
  const ei = +row.dataset.e, si = +row.dataset.s, en = S.active.entries[ei], s = en.sets[si], ex = EX[en.exId] || {};
  if (s.done) { s.done = false; s.res = null; }

const restEl = $('#rest');

function startRest(sec) {

function tickRest() {

/* finish */
function summary() {
  const a = S.active; let sets = 0, vol = 0, beat = 0, match = 0; const prs = [];
  a.entries.forEach(en => {
    const done = en.sets.filter(s => s.done);
    sets += done.length;
    done.forEach(s => { vol += (s.w || 0) * s.r; if (s.res === 'beat') beat++; if (s.res === 'match') match++; });
    if (done.length && EX[en.exId] && !EX[en.exId].bw) {
      const best = Math.max(...done.map(s => e1(s.w, s.r)));
      const prev = liftSeries(en.exId); const prevBest = prev.length ? Math.max(...prev.map(p => p.v)) : 0;
      if (prevBest && best > prevBest + 0.05) prs.push({n: EX[en.exId].n, v: best, d: best - prevBest});
    }
  });
  return {sets, vol, beat, match, prs, mins: Math.max(1, Math.round((Date.now() - a.startedAt) / 60000))};
}

const ICO = {

  heat:'<svg viewBox="0 0 26 26"><rect x="3" y="3" width="9" height="9" rx="2.5" fill="currentColor"/><rect x="14" y="3" width="9" height="9" rx="2.5" fill="currentColor" opacity=".45"/><rect x="3" y="14" width="9" height="9" rx="2.5" fill="currentColor" opacity=".2"/><rect x="14" y="14" width="9" height="9" rx="2.5" fill="currentColor" opacity=".75"/></svg>'
};
function startCoach(kind) {
  closeSheet(true); endCoach(true);
  const el = document.createElement('div');
  el.className = 'coach center instant';
  el.innerHTML = '<div class="coach-hole"></div><div class="coach-pop" role="dialog" aria-modal="true" aria-labelledby="coach-h"></div>';
  document.body.appendChild(el);
  coach = {el, kind, steps: kind === 'wo' ? WO_TIPS : TOUR, i: -1};
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  goCoach(0, 1);
}
function coachTargets(st) {
  const root = coach.kind === 'wo' ? wo : document;
  return [].concat(st.sel).map(q => root.querySelector(q)).filter(Boolean);
}
function goCoach(i, dir) {
  const c = coach; if (!c) return;
  for (; i >= 0 && i < c.steps.length; i += dir) {
    const st = c.steps[i];
    if (st.tab && !wo.classList.contains('open') && tab !== st.tab) { tab = st.tab; selMuscle = null; render(); }
    if (!st.sel) break;
    st._t = coachTargets(st);
    if (st._t.length) break;
  }
  if (i < 0) i = c.i;
  if (i >= c.steps.length) return endCoach();
  c.i = i;
  const st = c.steps[i], pop = c.el.querySelector('.coach-pop');
  const pts = c.steps.filter(x => x.sel), n = pts.indexOf(st);
  if (st.sel) {
    const t = st._t[0];
    if (coach.kind === 'wo') t.scrollIntoView({block:'center'});
    else if (st.tab) { const r = t.getBoundingClientRect(); if (!t.closest('.tabs')) window.scrollTo(0, Math.max(0, scrollY + r.top + r.height / 2 - innerHeight * 0.4)); }
    const last = !c.steps.slice(i + 1).some(x => x.sel ? coachTargets(x).length || x.tab : true);
    pop.innerHTML = `<div class="coach-in"><div class="coach-dots" aria-hidden="true">${pts.map((_, k) => `<i class="${k === n ? 'on' : ''}"></i>`).join('')}</div>
      <h2 id="coach-h">${st.h}</h2><p>${st.b}</p>
      <div class="coach-f"><button class="link" data-act="coachskip">${c.kind === 'wo' ? 'Hide tips' : 'Skip tour'}</button>
      <span class="r">${n > 0 ? '<button class="btn press" data-act="coachback">Back</button>' : ''}<button class="btn primary press" data-act="coachnext">${last ? (c.kind === 'wo' ? 'Let\'s lift' : 'Done') : 'Next'}</button></span></div></div>`;
  } else if (st.center === 'welcome') {
    pop.innerHTML = `<div class="coach-in"><div class="coach-hero"><img src="icons/icon-192.png" alt=""><h2 id="coach-h">Welcome to Rival</h2><p>The workout log where you race your last session.</p></div>
      <ul class="coach-list">
        <li><span class="ci"><span class="coach-ghost">80 × 8</span></span><span><b>Beat your ghost.</b> Last time's numbers sit beside every set.</span></li>
        <li><span class="ci">${ICO.ring}</span><span><b>Train to how you feel.</b> A 3-tap check-in tunes today's weights.</span></li>
        <li><span class="ci">${ICO.heat}</span><span><b>See every muscle.</b> A heat map tracks your weekly sets.</span></li>
      </ul>
      <div class="coach-f col"><button class="btn primary press" data-act="coachnext">Show me around</button><button class="link" data-act="coachskip">Skip, I'll explore</button></div></div>`;
  } else {
    window.scrollTo(0, 0);
    const smp = hasSamples();
    pop.innerHTML = `<div class="coach-in"><div class="coach-hero"><h2 id="coach-h">You're all set</h2></div>
      <p style="text-align:center">${smp ? 'The workouts already here are <b>samples</b>, so every screen has something to show. Clear them before your first real session, or keep them while you explore.' : 'Check in, hit Start, and go beat your ghost.'}</p>
      <p style="text-align:center;margin-top:8px;font-size:13.5px">See this tour again any time from Plan, then Settings.</p>
      <div class="coach-f col">${smp ? '<button class="btn primary press" data-act="coachclear">Clear samples and start fresh</button><button class="link" data-act="coachskip">Keep the samples for now</button>' : '<button class="btn primary press" data-act="coachskip">Let\'s go</button>'}</div></div>`;
  }
  c.el.classList.toggle('center', !st.sel);
  placeCoach();
  const f = pop.querySelector('[data-act=coachnext]') || pop.querySelector('.btn.primary'); if (f && kbNav) f.focus({preventScroll:true}); else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function placeCoach(instant) {
  const c = coach; if (!c) return;
  const st = c.steps[c.i], hole = c.el.querySelector('.coach-hole'), pop = c.el.querySelector('.coach-pop');
  if (instant) c.el.classList.add('instant');
  const vw = document.documentElement.clientWidth, vh = innerHeight, pw = pop.offsetWidth, ph = pop.offsetHeight;
  let hx = vw / 2, hy = vh / 2, hw = 0, hh = 0, rad = 18, py = Math.max(16, (vh - ph) / 2), px = (vw - pw) / 2;
  if (st.sel && st._t && st._t.length) {
    const rs = st._t.map(t => t.getBoundingClientRect()), pad = 6;
    const top = Math.max(8, Math.min(...rs.map(r => r.top)) - pad), bot = Math.min(vh - 8, Math.max(...rs.map(r => r.bottom)) + pad);
    const left = Math.max(6, Math.min(...rs.map(r => r.left)) - pad), right = Math.min(vw - 6, Math.max(...rs.map(r => r.right)) + pad);
    hx = left; hy = top; hw = Math.max(0, right - left); hh = Math.max(0, bot - top);
    rad = Math.min(24, (parseFloat(getComputedStyle(st._t[0]).borderTopLeftRadius) || 10) + pad);
    const gap = 12;
    if (vh - bot - gap >= ph + 12) py = bot + gap;
    else if (top - gap >= ph + 12) py = top - gap - ph;
    else py = vh - ph - 16;
    px = Math.min(Math.max(16, (left + right) / 2 - pw / 2), vw - pw - 16);
  } else { hx = vw / 2; hy = vh / 2; }
  Object.assign(hole.style, {left: hx + 'px', top: hy + 'px', width: hw + 'px', height: hh + 'px', borderRadius: rad + 'px'});
  Object.assign(pop.style, {left: px + 'px', top: py + 'px'});
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => c.el.classList.remove('instant')));
}
function endCoach(instant) {
  const c = coach; if (!c) return; coach = null;
  if (c.kind === 'wo') S.profile.tour.wo = true; else S.profile.tour.done = true;
  persist();
  if (instant) { c.el.remove(); return; }
  c.el.classList.remove('on'); setTimeout(() => c.el.remove(), 220);
  if (c.kind !== 'wo' && tab !== 'today') { tab = 'today'; render(); window.scrollTo(0, 0); }
}
addEventListener('resize', () => placeCoach(true));
document.addEventListener('scroll', () => placeCoach(true), {capture:true, passive:true});

const acts = {
  export() { exportBackup(); },
  importpick() { $('#importfile').click(); },
  restore() {
    const d = pendingImport; if (!d) return;
    S.profile = Object.assign(defaultProfile(), d.profile, {sampleCleared:true});
    S.sessions = d.sessions; normalizeProfile(); pendingImport = null; touch(); closeSheet(); render(); toast('Backup restored');
  },
  install() { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); },
  noinstall() { try { localStorage.setItem('rival.noinstall', '1'); } catch (e) {} render(); },
  tab(el) { tab = el.dataset.tab; selMuscle = null; render(); window.scrollTo(0, 0); },
  rq(el) {
    draftR[el.dataset.k] = +el.dataset.v;
    if (RQ.every(q => draftR[q.k] != null)) {
      const score = Math.round((draftR.sleep + draftR.sore + draftR.energy) / 9 * 100);
      S.profile.readiness = {date: dkey(Date.now()), ...draftR, score};
      draftR = {}; touch(); render();
      const card = view.querySelector('.ready'); if (card) card.classList.add('fade-in');
      const pr = $('#ringpr');
      if (pr && !reduced()) { const fin = pr.getAttribute('stroke-dashoffset'); pr.style.transition = 'none'; pr.setAttribute('stroke-dashoffset', pr.getAttribute('stroke-dasharray')); pr.getBoundingClientRect(); pr.style.transition = ''; pr.setAttribute('stroke-dashoffset', fin); }
      buzz(10);
    } else {
      view.querySelectorAll(`[data-act="rq"][data-k="${el.dataset.k}"]`).forEach(b => b.setAttribute('aria-pressed', b === el));
      const cnt = view.querySelector('.ready .ready-foot .sub'); if (cnt) cnt.textContent = Object.keys(draftR).length + ' of 3';
    }
  },
  skipr() { S.profile.readiness = {date: dkey(Date.now()), skipped: true}; draftR = {}; touch(); render(); },
  redo() { S.profile.readiness = null; draftR = {}; touch(); render(); },
  day(el) { S.profile.nextDay = +el.dataset.i; touch(); render(); },
  start() { if (S.active) return openWorkout(); startWorkout(S.profile.nextDay % S.profile.days.length); },
  resume() { if (S.active) openWorkout(); },
  min() { minimizeWorkout(); },
  log(el) { logSet(el.closest('.set')); },
  addset(el) {
    const ei = +el.dataset.e, en = S.active.entries[ei], last = en.sets[en.sets.length - 1];
    en.sets.push({w: last ? last.w : null, r: last ? last.r : en.lo, g: null, done:false, res:null});
    persist(); refreshEx(ei); $('#wo-count').textContent = countDone();
  },
  delset(el) {
    const ei = +el.dataset.e, en = S.active.entries[ei]; if (en.sets.length < 2) return;
    en.sets.pop(); persist(); refreshEx(ei); $('#wo-count').textContent = countDone();
  },
  finish() { finishSheet(); },
  save() { saveWorkout(); },
  discard(el) {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Tap again to discard'; return; }
    S.active = null; persist(); hideRest(); closeSheet(); minimizeWorkout(); toast('Workout discarded');
  },
  rest15() { restEnd += 15000; restTotal += 15; tickRest(); },
  restskip() { hideRest(); },
  closesheet() { closeSheet(); },
  muscle(el) { selMuscle = selMuscle === el.dataset.m ? null : el.dataset.m; const y = window.scrollY; render(); window.scrollTo(0, y); },
  lift(el) { liftSheet(el.dataset.id); },
  session(el) { sessionSheet(el.dataset.id); },
  delsession(el) {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Tap again to delete'; return; }
    const id = el.dataset.id; S.sessions = S.sessions.filter(s => s.id !== id); Sync.remove(id); persist(); closeSheet(); render(); toast('Workout deleted');
  },
  clearsample() {
    S.sessions = S.sessions.filter(s => !s.sample); S.profile.sampleCleared = true; S.profile.nextDay = 0; touch(); render(); toast('Sample workouts cleared');
  },
  wipe(el) {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Tap again to delete everything'; return; }
    S.sessions.forEach(s => Sync.remove(s.id)); S.sessions = []; S.profile.sampleCleared = true; S.profile.nextDay = 0; touch(); render(); toast('All workouts deleted');
  },
  units(el) { S.profile.units = el.dataset.u; touch(); render(); },
  rest(el) { const k = el.dataset.k; S.profile[k] = Math.max(30, Math.min(600, S.profile[k] + +el.dataset.d)); touch(); render(); },
  slot(el) { slotCtx = {d:+el.dataset.d, s:+el.dataset.s}; openSheet(slotHTML(slotCtx.d, slotCtx.s)); },
  slotstep(el) {
    const sl = S.profile.days[slotCtx.d].ex[slotCtx.s], k = el.dataset.k, v = +el.dataset.v;
    if (k === 'sets') sl.sets = Math.max(1, Math.min(8, sl.sets + v));
    if (k === 'lo') { sl.lo = Math.max(1, Math.min(30, sl.lo + v)); if (sl.hi < sl.lo) sl.hi = sl.lo; }
    if (k === 'hi') { sl.hi = Math.max(sl.lo, Math.min(40, sl.hi + v)); }
    if (k === 'rest') sl.rest = Math.max(30, Math.min(600, restFor(sl) + v * 15));
    touch(); setSheet(slotHTML(slotCtx.d, slotCtx.s)); render();
  },
  rmslot() {
    const d = S.profile.days[slotCtx.d], at = slotCtx.s, [gone] = d.ex.splice(at, 1);
    touch(); closeSheet(); render();
    toast('Removed ' + EX[gone.id].n, {label:'Undo', fn: () => { d.ex.splice(at, 0, gone); touch(); render(); }});
  },
  slotmove(el) {
    const d = S.profile.days[slotCtx.d], to = slotCtx.s + +el.dataset.v; if (to < 0 || to >= d.ex.length) return;
    [d.ex[slotCtx.s], d.ex[to]] = [d.ex[to], d.ex[slotCtx.s]]; slotCtx.s = to; touch(); setSheet(slotHTML(slotCtx.d, slotCtx.s)); render();
  },
  swapslot() {
    const sl = S.profile.days[slotCtx.d].ex[slotCtx.s], alt = EX[sl.id].alt; if (!alt) return;
    sl.id = alt; touch(); setSheet(slotHTML(slotCtx.d, slotCtx.s)); render(); toast('Switched to ' + EX[alt].n);
  },
  swapex(el) {
    const ei = +el.dataset.e, en = S.active.entries[ei], alt = EX[en.exId].alt; if (!alt || en.sets.some(x => x.done)) return;
    const plan = planSlot({id:alt, sets:en.sets.length, lo:en.lo, hi:en.hi}, tierOf(S.active.readiness));
    en.exId = alt; en.sets = plan.map(x => ({w:x.w, r:x.r, g:x.g ? {w:x.g.w, r:x.g.r} : null, done:false, res:null}));
    persist(); refreshEx(ei); toast('Using ' + EX[alt].n + ' for today');
  },
  woadd() { openLibrary({workout:true}); },
  libgroup(el) { libGroup = el.dataset.g; refreshLib(); const l = $('#liblist'); if (l) l.scrollIntoView({block:'nearest'}); },
  replace() { openLibrary({d:slotCtx.d, replace:slotCtx.s}); },
  addex(el) { openLibrary({d:+el.dataset.d}); },
  pick(el) {
    if (el.getAttribute('aria-disabled') === 'true') { toast('Already added'); return; }
    addToCtx(el.dataset.id);
  },
  cxnew(el) { cx = {id:null, n:(el && el.dataset.name) || '', kind:'free', c:1, prim:[], sec:[], inc:2.5}; openSheet(cxHTML()); },
  cxedit(el) { const c = S.profile.custom.find(x => x.id === el.dataset.id); if (!c) return; cx = clone(c); openSheet(cxHTML()); },
  cxkind(el) { cx.kind = el.dataset.v; if (cx.kind === 'bw' && cx.inc > 2.5) cx.inc = 2.5; setSheet(cxHTML()); },
  cxtype(el) { cx.c = +el.dataset.v; setSheet(cxHTML()); },
  cxm(el) {
    if (el.getAttribute('aria-disabled') === 'true') return;
    const f = el.dataset.f, m = el.dataset.m, arr = cx[f], i = arr.indexOf(m);
    if (i >= 0) arr.splice(i, 1); else arr.push(m);
    const y = sheetEl && sheetEl.querySelector('.sheet-body').scrollTop; setSheet(cxHTML()); if (sheetEl) sheetEl.querySelector('.sheet-body').scrollTop = y;
  },
  cxinc(el) { const i = Math.max(0, INC_STEPS.indexOf(cx.inc)); cx.inc = INC_STEPS[Math.max(0, Math.min(INC_STEPS.length - 1, i + +el.dataset.v))]; const y = sheetEl.querySelector('.sheet-body').scrollTop; setSheet(cxHTML()); sheetEl.querySelector('.sheet-body').scrollTop = y; },
  cxsave() {
    cx.n = cx.n.trim(); if (!cx.n || !cx.prim.length) return;
    let isNew = false;
    if (cx.id) { const i = S.profile.custom.findIndex(x => x.id === cx.id); S.profile.custom[i] = clone(cx); }
    else { cx.id = 'c' + newId(); S.profile.custom.push(clone(cx)); isNew = true; }
    registerCustom(cx); touch();
    if (isNew && libCtx) { toast('Created ' + cx.n); addToCtx(cx.id); }
    else { closeSheet(); render(); toast(isNew ? 'Created ' + cx.n : 'Saved ' + cx.n); }
  },
  cxdel(el) {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Tap again to delete'; return; }
    const c = S.profile.custom.find(x => x.id === cx.id); if (!c) return;
    c.hidden = true; registerCustom(c);
    S.profile.days.forEach(d => { d.ex = d.ex.filter(sl => sl.id !== c.id); });
    touch(); closeSheet(); render(); toast('Deleted ' + c.n + '. Past workouts keep it.');
  },
  wlog(el) {
    const en = S.active.entries[+el.dataset.e], i = +el.dataset.i; en.wdone = en.wdone || [];
    en.wdone[i] = !en.wdone[i]; el.classList.toggle('done', en.wdone[i]); el.setAttribute('aria-pressed', en.wdone[i]); buzz(6); persist();
  },
  plates(el) {
    const ei = +el.dataset.e, en = S.active.entries[ei];
    let si = en.sets.findIndex(x => !x.done); if (si < 0) si = en.sets.length - 1;
    const row = wo.querySelector(`.set[data-e="${ei}"][data-s="${si}"] .in-w`);
    const typed = row ? toKg(row.value) : null;
    plateCtx = {ei, si, w: typed != null ? typed : (en.sets[si].w || S.profile.bars[barType(en.exId)])};
    openSheet(plateHTML());
  },
  pcw(el) {
    const en = S.active.entries[plateCtx.ei], ex = EX[en.exId], stepKg = U() === 'lb' ? 5 / 2.20462 : (ex.inc || 2.5);
    plateCtx.w = Math.max(0, +(plateCtx.w + +el.dataset.v * stepKg).toFixed(3)); if (U() === 'lb') plateCtx.w = toKg(Math.round(toUnit(plateCtx.w) / 5) * 5);
    setSheet(plateHTML());
  },
  pcbar(el) {
    const bt = barType(S.active.entries[plateCtx.ei].exId), step = U() === 'lb' ? 5 / 2.20462 : 2.5;
    let v = S.profile.bars[bt] + +el.dataset.v * step; v = Math.max(0, Math.min(40, v)); if (U() === 'lb') v = toKg(Math.round(toUnit(v) / 5) * 5);
    S.profile.bars[bt] = +v.toFixed(2); touch(); setSheet(plateHTML());
  },
  pcuse() {
    const {ei, si, w} = plateCtx, en = S.active.entries[ei], s = en.sets[si];
    s.w = w; s._auto = false; for (let j = si + 1; j < en.sets.length; j++) if (!en.sets[j].done && en.sets[j]._auto !== false) en.sets[j].w = w;
    persist(); closeSheet(); refreshEx(ei);
  },
  warmset(el) { S.profile.warmups = el.dataset.v === '1'; touch(); render(); },
  coachnext() { if (coach) goCoach(coach.i + 1, 1); },
  coachback() { if (coach) goCoach(coach.i - 1, -1); },
  coachskip() { endCoach(); },
  coachclear() { endCoach(); acts.clearsample(); },
  replaytour() { S.profile.tour = {done:false, wo:false}; persist(); startCoach('tour'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = acts[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('keydown', e => {
  if (coach) {
    if (e.key === 'Escape') { e.preventDefault(); endCoach(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); acts.coachnext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); acts.coachback(); }
    else if (e.key === 'Tab') { const b = [...coach.el.querySelectorAll('button')]; const k = b.indexOf(document.activeElement); e.preventDefault(); b[(k + (e.shiftKey ? -1 : 1) + b.length) % b.length].focus(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')) { e.preventDefault(); acts.muscle(e.target); }
  if (e.key === 'Escape' && sheetEl) closeSheet();
});
document.addEventListener('input', e => {
  if (e.target.id === 'cxname' && cx) {
    cx.n = e.target.value; const b = sheetEl && sheetEl.querySelector('[data-act=cxsave]'); const ok = cx.n.trim() && cx.prim.length;
    if (b) b.disabled = !ok; return;
  }
  if (e.target.id === 'libq') { $('#liblist').innerHTML = libHTML(e.target.value); return; }
  if (e.target.id === 'slotnote' && slotCtx) { const sl = S.profile.days[slotCtx.d].ex[slotCtx.s]; sl.note = e.target.value.trim(); clearTimeout(noteT); noteT = setTimeout(() => { touch(); render(); }, 500); return; }
  const row = e.target.closest('.set'); if (!row || !S.active) return;
  const en = S.active.entries[+row.dataset.e], s = en.sets[+row.dataset.s];
  if (e.target.classList.contains('in-w')) { s.w = toKg(e.target.value); s._auto = false;
    if (+row.dataset.s === 0) { clearTimeout(wuT); const ei = +row.dataset.e; wuT = setTimeout(() => { const sec = wo.querySelector(`.ex[data-e="${ei}"] .wu`); const wu = warmups(en, ei);
      if (sec || wu.length) { const tmp = document.createElement('div'); tmp.innerHTML = exBlock(en, ei); const nw = tmp.querySelector('.wu'); if (sec && nw) sec.replaceWith(nw); else if (sec) sec.remove(); else if (nw) wo.querySelector(`.ex[data-e="${ei}"] .cols`).before(nw); } }, 600); } }
  if (e.target.classList.contains('in-r')) { const r = parseInt(e.target.value, 10); s.r = isNaN(r) ? null : r; }
  persist();
});
document.addEventListener('focusin', e => { if (e.target.matches('.set input')) setTimeout(() => e.target.select && e.target.select(), 0); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wo.classList.contains('open') && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(() => {});
  if (document.visibilityState === 'visible' && restEnd) tickRest();
});
setInterval(() => {
  if (!S.active) return;
  const t = fmtClock((Date.now() - S.active.startedAt) / 1000);
  document.querySelectorAll('[data-elapsed]').forEach(el => el.textContent = t);
}, 1000);

/* ================= boot ================= */
$('#importfile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) readBackup(f); e.target.value = ''; });
render();
if (S.active) updateResume();
if (!S.profile.tour.done && !S.active) setTimeout(() => { if (!coach && !sheetEl) startCoach('tour'); }, 300);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
